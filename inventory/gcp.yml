---
all:
  vars:
    # GKE cluster variables
    gcp_project: ascn-25-26 # ID of GCP Project
    gcp_auth_kind: serviceaccount # Do not change
    gcp_cred_file: "/home/vagrant/codebase/ascn-25-26-a349bf760a29.json" # Path to service account keys (json file downloaded from GCP)

    gcp_zone: us-central1-a
    gcp_image_type: ubuntu_containerd
    gcp_machine_type: e2-small # Can be changed if necessary
    gcp_disk_size_gb: 100 # Can be changed if necessary
    gcp_initial_node_count: 2 # Number of nodes to create. Can be changed if necessary

    # BEGIN Test variables (DO NOT CHANGE)
    app_admin: admin
    app_admin_password: admin1234
    app_admin_display_name: Admin
    app_admin_unit: metric
    app_admin_api_key: <APP_ADMIN_API_KEY>
    app_admin_flight_id: <APP_ADMIN_FLIGHT_ID>
    # END Test variables (DO NOT CHANGE)

    # App variables
    app_ip: "35.193.109.43"
    app_port: "80"

    # Additional variables
    k8s_namespace: "default"
    
    # App Performance (Tarefa 2)
    app_replicas: 3 
    app_container_port: 3000
    
    # HPA Settings
    hpa_min_replicas: 1
    hpa_max_replicas: 10
    hpa_cpu_target: 70
    
    # Database Settings
    db_name: "airtrail"
    db_user: "airtrail"
    db_password: "airtrail"
    db_storage_size: "1Gi"
    db_image: "postgres:15"